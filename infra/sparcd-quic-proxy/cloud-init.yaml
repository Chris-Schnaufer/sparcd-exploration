#cloud-config
# sparcd-quic-proxy-02: Caddy HTTP/3 front for the JS2 object store (Ceph RGW).
#
# Ports 443/8443/8444/8445 all serve the same handler: browsers key
# connections on host+port, so the uploader stripes its lanes across the
# ports to escape HTTP/2+3 single-connection coalescing (one congestion
# window otherwise caps throughput at a single flow's share of the path).
#
# NOT YET DEPLOYED (2026-07-31): the running instance carries the previous
# revision, whose extra ports strip the port from the forwarded Host and so
# fail SigV4 on :8443-:8445. This revision forwards the exact authority the
# client signed ({host} on :443 where clients sign portless, hostport on the
# extra ports where clients sign host:port). Deploy at the next rebuild —
# after 2026-08-06, when the Let's Encrypt per-name budget (5/week) resets.
#
# Hard-won details (see infra/sparcd-quic-proxy/README.md):
# - The forwarded Host must byte-match what the client signed (SigV4).
# - Caddy owns CORS: RGW only answers CORS per bucket, so service-level
#   calls (ListBuckets = collection discovery) die in browsers without this.
#   header_down strips RGW's per-bucket CORS so headers never double up.
# - request_buffers 16KiB: h3 requests carry no Content-Length; without
#   buffering, Caddy forwards bodyless requests to the h1.1 upstream as
#   Transfer-Encoding: chunked, which RGW rejects with 501 NotImplemented.
write_files:
  - path: /etc/caddy/Caddyfile.sparcd
    permissions: '0644'
    content: |
      (s3rgw) {
        @preflight method OPTIONS
        handle @preflight {
          header Access-Control-Allow-Origin "{http.request.header.Origin}"
          header Access-Control-Allow-Methods "GET, HEAD, PUT, POST, DELETE"
          header Access-Control-Allow-Headers "authorization, content-type, if-match, if-none-match, range, amz-sdk-invocation-id, amz-sdk-request, x-amz-content-sha256, x-amz-date, x-amz-meta-sha256, x-amz-user-agent, x-amz-checksum-crc32, x-amz-checksum-sha256, x-amz-checksum-mode, x-amz-sdk-checksum-algorithm, x-amz-security-token, x-amz-decoded-content-length, x-amz-trailer"
          header Access-Control-Max-Age "600"
          header Vary "Origin"
          respond "" 204
        }
        log
        handle {
          header {
            Access-Control-Allow-Origin "{http.request.header.Origin}"
            Access-Control-Expose-Headers "ETag, Content-Length, x-amz-meta-sha256, x-amz-request-id, x-amz-version-id"
            Vary "Origin"
          }
          reverse_proxy https://js2.jetstream-cloud.org:8001 {
            header_up Host {args[0]}
            request_buffers 16KiB
            header_down -Access-Control-Allow-Origin
            header_down -Access-Control-Allow-Methods
            header_down -Access-Control-Allow-Headers
            header_down -Access-Control-Expose-Headers
            header_down -Access-Control-Max-Age
          }
        }
      }
      sparcd-quic-proxy-02.bio260073.projects.jetstream-cloud.org:443 {
        import s3rgw {host}
      }
      sparcd-quic-proxy-02.bio260073.projects.jetstream-cloud.org:8443,
      sparcd-quic-proxy-02.bio260073.projects.jetstream-cloud.org:8444,
      sparcd-quic-proxy-02.bio260073.projects.jetstream-cloud.org:8445 {
        import s3rgw {http.request.hostport}
      }
runcmd:
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y debian-keyring debian-archive-keyring apt-transport-https curl
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
  - curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' | tee /etc/apt/sources.list.d/caddy-stable.list
  - apt-get update
  - DEBIAN_FRONTEND=noninteractive apt-get install -y caddy
  - mv /etc/caddy/Caddyfile.sparcd /etc/caddy/Caddyfile
  - systemctl restart caddy
