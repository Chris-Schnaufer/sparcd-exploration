name = "sparcd-shard-proxy"
main = "worker.js"
compatibility_date = "2026-01-01"

[vars]
# The S3 endpoint being fronted, with scheme and port.
UPSTREAM = "https://js2.jetstream-cloud.org:8001"
S3_REGION = "us-east-1"

# The shard origins. One Worker, several hostnames: browsers open a separate
# connection per hostname, which is the whole point. Each name needs a DNS
# record in a zone on this Cloudflare account; `custom_domain = true` makes
# wrangler create and manage it.
#
# Adding a shard is one more block here and one more entry in the client's
# shard-endpoint list. Nothing else changes.
[[routes]]
pattern = "shard1.example.org"
custom_domain = true

[[routes]]
pattern = "shard2.example.org"
custom_domain = true

[[routes]]
pattern = "shard3.example.org"
custom_domain = true

[[routes]]
pattern = "shard4.example.org"
custom_domain = true

# Four secrets, not vars. Two pairs, and the Worker will not start serving
# usefully without all four — see the README:
#
#   npx wrangler secret put S3_ACCESS_KEY_ID       # reaches the upstream
#   npx wrangler secret put S3_SECRET_ACCESS_KEY
#   npx wrangler secret put CLIENT_ACCESS_KEY_ID   # what browsers sign with
#   npx wrangler secret put CLIENT_SECRET_ACCESS_KEY
#
# For `wrangler dev`, put the same four in an untracked `.dev.vars`.
