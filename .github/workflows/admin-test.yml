name: Admin test
on:
  pull_request:
    paths: ["apps/sparcd-admin/**", "packages/**", "pnpm-lock.yaml", ".github/workflows/admin-test.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter sparcd-admin check && pnpm --filter sparcd-admin test
