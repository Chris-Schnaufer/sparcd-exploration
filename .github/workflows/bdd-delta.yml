name: BDD delta

# Advisory only: reports the scenario-level BDD changes a PR makes.
# It never fails the build.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "apps/**"
      - "packages/**"
      - ".github/workflows/bdd-delta.yml"
      - "scripts/bdd-delta.mjs"

permissions:
  contents: read
  pull-requests: write

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build report
        id: report
        run: |
          {
            echo 'body<<BDD_DELTA_EOF'
            node scripts/bdd-delta.mjs --base origin/${{ github.base_ref }}
            echo 'BDD_DELTA_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Job summary
        run: echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"
        env:
          REPORT: ${{ steps.report.outputs.body }}

      # Fork PRs get a read-only token, so the comment upsert would 403;
      # for those the job summary above is the report.
      - name: Post sticky comment
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const body = process.env.REPORT
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number })
            const existing = comments.find((c) => c.body.includes('<!-- bdd-delta -->'))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }
        env:
          REPORT: ${{ steps.report.outputs.body }}
