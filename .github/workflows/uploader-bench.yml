name: Uploader performance guard

on:
  pull_request:
    paths:
      - "apps/sparcd-uploader/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/uploader-bench.yml"
  push:
    branches: [main]
    paths:
      - "apps/sparcd-uploader/**"
      - "packages/**"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "turbo.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/uploader-bench.yml"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BENCH_BASELINE_FILE: ${{ github.workspace }}/bench-baseline.json
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright chromium
        working-directory: apps/sparcd-uploader
        run: pnpm exec playwright install --with-deps chromium

      # Blocking: exact object/request-profile checks and catastrophic backstops.
      - name: Run uploader benchmark
        run: pnpm --filter sparcd-uploader bench

      # Non-blocking timing comparison against the rolling main-branch baseline.
      - name: Restore timing baseline
        if: always()
        uses: actions/cache/restore@v4
        with:
          path: bench-baseline.json
          key: uploader-bench-baseline-${{ github.sha }}
          restore-keys: uploader-bench-baseline-

      - name: Timing report
        id: report
        if: always()
        continue-on-error: true
        run: node apps/sparcd-uploader/bench/report.mjs compare

      # Same sticky-comment convention as the BDD delta workflow: HTML marker +
      # github-script upsert. Skipped on fork PRs (read-only token); the job
      # summary still carries the table there.
      - name: Comment timings on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const file = 'apps/sparcd-uploader/bench/results/report.md'
            if (!fs.existsSync(file)) return
            const body = fs.readFileSync(file, 'utf8')
            const { owner, repo } = context.repo
            const issue_number = context.issue.number
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number })
            const existing = comments.find((c) => c.body.includes('<!-- uploader-bench -->'))
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body })
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body })
            }

      - name: Update timing baseline (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node apps/sparcd-uploader/bench/report.mjs update

      - name: Save timing baseline (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: bench-baseline.json
          key: uploader-bench-baseline-${{ github.sha }}

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uploader-bench-results
          path: apps/sparcd-uploader/bench/results/*
